services:
  truth-api:
    build:
      context: .
      dockerfile: apps/truth-api/Dockerfile
    environment:
      TRUTHOS_ENV: ${TRUTHOS_ENV:-development}
      TRUTHOS_DB_PATH: ${TRUTHOS_DB_PATH:-/app/data/truthos.db}
      TRUTHOS_API_HOST: ${TRUTHOS_API_HOST:-0.0.0.0}
      TRUTHOS_API_PORT: ${TRUTHOS_API_PORT:-8000}
    command: >
      sh -lc "python scripts/seed_import.py
      && cd apps/truth-api
      && uvicorn app.main:app --host ${TRUTHOS_API_HOST:-0.0.0.0} --port ${TRUTHOS_API_PORT:-8000}"
    volumes:
      - ./:/app
    ports:
      - "18000:${TRUTHOS_API_PORT:-8000}"
