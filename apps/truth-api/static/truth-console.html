<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TruthOS Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto max-w-7xl px-4 py-5">
    <header class="flex flex-col gap-3 border-b border-zinc-800 pb-4 md:flex-row md:items-center md:justify-between">
      <div><h1 class="text-2xl font-semibold">TruthOS Console</h1><p class="text-sm text-zinc-400">Coach Review UI and Truth Console MVP</p></div>
      <button id="theme" class="w-fit rounded border border-zinc-700 px-3 py-2 text-sm">Light mode</button>
    </header>
    <nav id="tabs" class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-5"></nav>
    <section class="mt-4 flex flex-col gap-3 border-b border-zinc-800 pb-4 md:flex-row md:items-end">
      <label class="flex-1"><span class="block text-sm text-zinc-400">User ID</span><input id="user" class="mt-1 w-full rounded border border-zinc-700 bg-zinc-900 px-3 py-2" value="test-sprint006" /></label>
      <button id="load" class="rounded bg-cyan-500 px-4 py-2 font-medium text-zinc-950">Load</button>
    </section>
    <div id="err" class="mt-4 hidden rounded border border-red-800 bg-red-950 p-3 text-red-100"></div>
    <div id="spin" class="mt-4 hidden rounded border border-zinc-800 bg-zinc-900 p-3 text-zinc-300">Loading...</div>
    <section id="out" class="mt-5"></section>
  </main>
<script>
const state={user:'test-sprint006',tab:'soul',blind:'active',hard:'pending',light:false};
const tabs=[['soul','Soul Map'],['blind','Blind Spots'],['hard','Hard Cases'],['reviews','Designer Reviews'],['knowledge','Knowledge Evolution']];
const $=id=>document.getElementById(id), out=$('out');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function q(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function when(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()}
function empty(t){return `<div class="rounded border border-zinc-800 p-4 text-sm text-zinc-400">${esc(t)}</div>`}
function chips(a){return (a||[]).map(x=>`<span class="mr-2 mt-2 inline-block rounded bg-zinc-800 px-2 py-1 text-xs">${esc(x)}</span>`).join('')}
function tabClass(id){return 'rounded border px-3 py-2 text-sm font-medium '+(state.tab===id?'border-cyan-400 bg-cyan-500 text-zinc-950':'border-zinc-800 bg-zinc-900 text-zinc-200')}
function renderTabs(){ $('tabs').innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" class="${tabClass(id)}">${label}</button>`).join(''); document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderTabs();load()}) }
function showErr(e){$('err').textContent=e;$('err').classList.remove('hidden')} function clearErr(){$('err').classList.add('hidden');$('err').textContent=''} function spin(v){$('spin').classList.toggle('hidden',!v)}
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt}); if(!r.ok){let d=`${r.status} ${r.statusText}`;try{const b=await r.json();d=b.detail||JSON.stringify(b)}catch{} throw new Error(d)} return r.json()}
async function mutate(path,body,method='PATCH'){clearErr();spin(true);try{await api(path,{method,body:body?JSON.stringify(body):undefined});await load()}catch(e){showErr(e.message)}finally{spin(false)}}
async function load(){state.user=$('user').value.trim()||'test-sprint006'; clearErr(); spin(true); try{ if(state.tab==='soul') renderSoul(await api(`/api/soul-map/${encodeURIComponent(state.user)}`)); if(state.tab==='blind') renderBlind(await api(`/api/soul-map/${encodeURIComponent(state.user)}/blind-spots?status=${state.blind}`)); if(state.tab==='hard') renderHard(await api(`/api/designer/hard-cases?status=${state.hard}&limit=20`)); if(state.tab==='reviews') renderReviews(await api('/api/designer/reviews?limit=30')); if(state.tab==='knowledge') renderKnowledge(await api('/api/designer/knowledge-evolution?limit=30')); }catch(e){showErr(e.message)}finally{spin(false)}}
function stageBar(s){const a=['awakening','recognizing','understanding','practicing','integrating','transcended'];return `<div class="grid gap-2 md:grid-cols-6">${a.map(x=>`<div class="rounded border px-2 py-2 text-center text-xs ${x===s?'border-cyan-400 bg-cyan-500 text-zinc-950':'border-zinc-800 bg-zinc-900 text-zinc-400'}">${x}</div>`).join('')}</div>`}
function renderSoul(d){if(!d||d.status==='not_yet_built'){out.innerHTML=empty(d?.message||'Soul Map not yet built.');return} const w=d.pattern_weights||{}; out.innerHTML=`<div class="space-y-5"><div class="flex justify-between gap-3"><div><h2 class="text-xl font-semibold">Soul Map</h2><p class="text-sm text-zinc-400">Evolution stage: <span class="text-cyan-300">${esc(d.evolution_stage||'awakening')}</span></p></div><button class="rounded border border-zinc-700 px-3 py-2 text-sm" onclick="load()">Refresh</button></div>${stageBar(d.evolution_stage)}${d.summary?`<section class="rounded border border-zinc-800 p-4"><h3 class="font-medium">Summary</h3><p class="mt-2 text-sm text-zinc-300">${esc(d.summary)}</p></section>`:''}<section><h3 class="mb-2 font-medium">Recurring Patterns</h3>${(d.recurring_patterns||[]).length?(d.recurring_patterns||[]).map(p=>pattern(p,w)).join(''):empty('No recurring patterns detected yet.')}</section><section><h3 class="mb-2 font-medium">Active Lessons</h3>${(d.active_lessons||[]).length?d.active_lessons.map(l=>`<div class="mb-2 rounded border border-zinc-800 p-4 text-sm"><b>${esc(l.principle_id||'Unknown')}</b><span class="text-zinc-400"> - ${esc(l.dimension||'unknown')} - ${esc(l.status||'active')}</span></div>`).join(''):empty('No active lessons recorded yet.')}</section><section><h3 class="mb-2 font-medium">Integrated Dimensions</h3>${chips(d.integrated_dimensions)||empty('No integrated dimensions recorded yet.')}</section><section class="rounded border border-zinc-800 p-4"><h3 class="font-medium">Last Truth Shift</h3><p class="mt-2 text-sm text-zinc-300">${when(d.last_truth_shift_at)||'No truth shift recorded yet.'}</p></section><section><h3 class="mb-2 font-medium">Evolution History</h3>${(d.evolution_history||[]).length?d.evolution_history.map(h=>`<div class="mb-2 rounded border border-zinc-800 p-4 text-sm"><b>${esc(h.from_stage||'unknown')} -> ${esc(h.to_stage||'unknown')}</b><span class="text-zinc-400"> - ${when(h.timestamp)} - ${esc(h.trigger_pattern||'')}</span></div>`).join(''):empty('No evolution history recorded yet.')}</section></div>`}
function pattern(p,w){const wt=w?.[p.id]||{}, pct=Math.round(Number(wt.weight||p.weight||0)*100); return `<div class="mb-2 rounded border border-zinc-800 p-4"><div class="flex flex-col gap-2 md:flex-row md:justify-between"><div><p class="font-medium">${esc(p.description||p.label||p.id)}</p><p class="text-xs text-zinc-400">${esc(p.id)} ${p.status?'- '+esc(p.status):''}</p></div><button class="rounded border border-zinc-700 px-3 py-1 text-sm" onclick="markPattern('${q(p.id)}','softening')">Mark as Softening</button></div><div class="mt-3 h-2 rounded bg-zinc-800"><div class="h-2 rounded bg-cyan-400" style="width:${Math.min(pct,100)}%"></div></div><p class="mt-2 text-xs text-zinc-400">Weight ${pct}% - Frequency ${wt.frequency||0} - First seen ${when(p.first_seen)||'unknown'}</p></div>`}
function statusTabs(vals,current,kind){return `<div class="flex flex-wrap gap-2">${vals.map(v=>`<button class="rounded border px-3 py-1 text-sm ${v===current?'border-cyan-400 bg-cyan-500 text-zinc-950':'border-zinc-800 bg-zinc-900'}" onclick="state.${kind}='${v}';load()">${v}</button>`).join('')}</div>`}
function sev(s){const c={low:'bg-zinc-700',medium:'bg-yellow-600 text-zinc-950',high:'bg-orange-600',critical:'bg-red-700'};return `<span class="w-fit rounded px-2 py-1 text-xs ${c[s]||c.medium}">${esc(s)}</span>`}
function renderBlind(d){const items=d.blind_spots||[];out.innerHTML=`<div class="space-y-4"><h2 class="text-xl font-semibold">Blind Spots</h2>${statusTabs(['active','softening','integrated','transcended'],state.blind,'blind')}${items.length?items.map(b=>`<article class="rounded border border-zinc-800 p-4"><div class="flex flex-col gap-2 md:flex-row md:justify-between"><div><h3 class="font-medium">${esc(b.title||'Untitled')}</h3><p class="text-sm text-zinc-400">${esc(b.triggerpattern||'')}</p></div>${sev(b.severity||'medium')}</div><div class="mt-3">${chips(b.domainsjson||[])}</div><p class="mt-3 text-sm text-zinc-400">Frequency ${b.frequency||0} - Last seen ${when(b.lastseenat)||'unknown'} - Status ${esc(b.resolutionstatus||'active')}</p><div class="mt-3 grid gap-3 md:grid-cols-2"><div><p class="text-xs uppercase text-zinc-500">Known theory</p><p class="text-sm">${esc(b.knowntheory||'Not recorded')}</p></div><div><p class="text-xs uppercase text-zinc-500">Failure mode</p><p class="text-sm">${esc(b.practicalfailuremode||'Not recorded')}</p></div></div><div class="mt-4 flex gap-2"><button class="rounded border border-zinc-700 px-3 py-1 text-sm" onclick="markBlind('${q(b.id)}','softening')">Mark Softening</button><button class="rounded border border-zinc-700 px-3 py-1 text-sm" onclick="markBlind('${q(b.id)}','integrated')">Mark Integrated</button></div></article>`).join(''):empty('No blind spots recorded for this status.')}</div>`}
function renderHard(d){const items=d.hard_cases||[];out.innerHTML=`<div class="space-y-4"><h2 class="text-xl font-semibold">Hard Cases</h2>${statusTabs(['pending','in_review','resolved','escalated_to_coach'],state.hard,'hard')}${items.length?items.map(h=>hardRow(h)).join(''):empty('No hard cases recorded for this status.')}</div>`}
function hardRow(h){return `<article class="rounded border border-zinc-800 p-4"><div class="flex flex-col gap-2 md:flex-row md:justify-between"><div><h3 class="font-medium">${esc(h.userid)}</h3><p class="text-sm text-zinc-400">Session ${esc(h.sessionid||'none')} - ${when(h.createdat)}</p></div><span class="rounded bg-zinc-800 px-2 py-1 text-xs">${esc(h.status||'pending')}</span></div><ul class="mt-3 list-disc pl-5 text-sm text-zinc-300">${(h.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('')||'<li>No reasons recorded.</li>'}</ul>${h.resolutionnote?`<p class="mt-3 text-sm text-zinc-400">Resolution: ${esc(h.resolutionnote)}</p>`:''}<div class="mt-4 flex gap-2"><button class="rounded bg-cyan-500 px-3 py-1 text-sm font-medium text-zinc-950" onclick="review('${q(h.userid)}')">Trigger Review</button><button class="rounded border border-zinc-700 px-3 py-1 text-sm" onclick="document.getElementById('coach-${esc(h.userid)}').classList.toggle('hidden')">Submit Coach Note</button></div><form id="coach-${esc(h.userid)}" class="mt-4 hidden space-y-2" onsubmit="coach(event,'${q(h.userid)}')"><textarea name="note" required class="w-full rounded border border-zinc-700 bg-zinc-900 p-2 text-sm" rows="3" placeholder="Coach note"></textarea><div class="grid gap-2 md:grid-cols-2"><select name="action" class="rounded border border-zinc-700 bg-zinc-900 p-2 text-sm"><option value="resolved">Resolved</option><option value="new_puzzle_needed">New puzzle needed</option><option value="prompt_update_needed">Prompt update needed</option><option value="escalate">Escalate</option></select><input name="new_principle_proposed" class="rounded border border-zinc-700 bg-zinc-900 p-2 text-sm" placeholder="New principle proposed (optional)" /></div><button class="rounded bg-cyan-500 px-3 py-1 text-sm font-medium text-zinc-950">Submit</button></form></article>`}
function badge(a){const c=(a==='apply_prompt_winner'||a==='resolved')?'bg-green-700':(a==='escalate_to_human_coach'||a==='escalate')?'bg-red-700':'bg-orange-700';return `<span class="w-fit rounded px-2 py-1 text-xs ${c}">${esc(a||'unknown')}</span>`}
function details(l,v){return `<details class="mt-3 rounded border border-zinc-800 p-3"><summary class="cursor-pointer text-sm">${l}</summary><pre class="mt-3 overflow-auto text-xs text-zinc-300">${esc(JSON.stringify(v||{},null,2))}</pre></details>`}
function renderReviews(d){const items=d.reviews||[];out.innerHTML=`<div class="space-y-4"><h2 class="text-xl font-semibold">Designer Reviews</h2>${items.length?items.map(r=>`<article class="rounded border border-zinc-800 p-4"><div class="flex flex-col gap-2 md:flex-row md:justify-between"><div><h3 class="font-medium">${esc(r.hardcaseid)}</h3><p class="text-sm text-zinc-400">${esc(r.reviewedby)} - ${when(r.createdat)}</p></div>${badge(r.action)}</div><p class="mt-2 text-sm text-zinc-400">Winner: ${esc(r.promptwinner||'none')}</p>${details('Findings',r.findingsjson)}</article>`).join(''):empty('No designer reviews recorded yet.')}</div>`}
function renderKnowledge(d){const items=d.knowledge_evolutions||[];out.innerHTML=`<div class="space-y-4"><h2 class="text-xl font-semibold">Knowledge Evolution</h2>${items.length?items.map(k=>`<article class="rounded border border-zinc-800 p-4"><div class="flex flex-col gap-2 md:flex-row md:justify-between"><div><h3 class="font-medium">${esc(k.sourcetype)} / ${esc(k.sourceid)}</h3><p class="text-sm text-zinc-400">${when(k.createdat)}</p></div><span class="rounded bg-zinc-800 px-2 py-1 text-xs">${esc(k.changetype)}</span></div><p class="mt-2 text-sm text-zinc-400">Target: ${esc(k.targetid||'none')}</p>${details('Rationale',k.rationaljson)}</article>`).join(''):empty('No knowledge evolution records yet.')}</div>`}
async function markPattern(id,s){await mutate(`/api/soul-map/${encodeURIComponent(state.user)}/pattern`,{pattern_id:id,new_status:s})}
async function markBlind(id,s){await mutate(`/api/soul-map/${encodeURIComponent(state.user)}/blind-spot/${encodeURIComponent(id)}`,{resolution_status:s})}
async function review(id){await mutate(`/api/designer/hard-cases/${encodeURIComponent(id)}/review`,null,'POST')}
async function coach(e,id){e.preventDefault();const f=e.target;await mutate(`/api/designer/coach-review/${encodeURIComponent(id)}`,{note:f.note.value,action:f.action.value,new_principle_proposed:f.new_principle_proposed.value||null},'POST')}
$('load').onclick=load; $('theme').onclick=()=>{state.light=!state.light;document.body.className=state.light?'min-h-screen bg-white text-zinc-950':'min-h-screen bg-zinc-950 text-zinc-100';$('theme').textContent=state.light?'Dark mode':'Light mode'}; renderTabs(); load();
</script>
</body>
</html>
