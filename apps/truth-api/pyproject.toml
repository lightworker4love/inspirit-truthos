[project]
name = "inspirit-truth-api"
version = "0.1.0"
description = "in spirit case auth and model routing backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "passlib[argon2]==1.7.4",
  "argon2-cffi==23.1.0",
  "email-validator==2.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0"
]
# Phase 1 memory activation deps — NOT installed by default.
# Enable only when MEMORY_LONGTERM_ENABLED=true and infra is validated.
# Install with: pip install -e '.[memory]'
# Verify latest stable tag at: https://pypi.org/project/mem0ai/ before pinning.
memory = [
  "mem0ai>=0.1.25,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
