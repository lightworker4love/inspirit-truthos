name: TruthOS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/truth-api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Seed test database and run migrations
        run: |
          TRUTHOS_DB_PATH=/tmp/test_truthos.db python scripts/seed_import.py
        env:
          TRUTHOS_DB_PATH: /tmp/test_truthos.db

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short
        env:
          TRUTHOS_DB_PATH: /tmp/test_truthos.db
          TESTING: "true"

      - name: Validate truth property tagging
        run: |
          python scripts/tag_truth_properties.py --db /tmp/test_truthos.db --report
        env:
          TRUTHOS_DB_PATH: /tmp/test_truthos.db

  py-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check all Python files
        run: |
          find . -name "*.py" -not -path "./.venv/*" | xargs python3 -m py_compile
          echo "All Python files syntax OK"
