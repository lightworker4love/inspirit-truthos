name: Deploy to Railway

on:
  workflow_run:
    workflows:
      - TruthOS CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Verify existing Railway access without starting any deployment
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_PROJECT_ID: 2a0c0d84-ad7b-493a-84dd-eebcda0248cf
      RAILWAY_ENVIRONMENT: production
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.57.2

      - name: Verify Railway token
        env:
          RAILWAY_DEPLOY_CREDENTIAL: ${{ secrets.RAILWAY_TOKEN }}
        run: node .github/scripts/verify-railway-auth.mjs

      - name: Deploy truth-api
        if: ${{ !inputs.preflight_only }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service truth-api \
            --ci \
            --message "GitHub Actions deploy truth-api ${DEPLOY_SHA}"
          node .github/scripts/wait-railway-deployment.mjs truth-api

      - name: Deploy hermes-agent
        if: ${{ !inputs.preflight_only }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service hermes-agent \
            --ci \
            --message "GitHub Actions deploy hermes-agent ${DEPLOY_SHA}"
          node .github/scripts/wait-railway-deployment.mjs hermes-agent

      - name: Deploy truthos-web
        if: ${{ !inputs.preflight_only }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service truthos-web \
            --ci \
            --message "GitHub Actions deploy truthos-web ${DEPLOY_SHA}"
          node .github/scripts/wait-railway-deployment.mjs truthos-web
