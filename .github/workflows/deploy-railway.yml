name: Deploy to Railway

on:
  workflow_run:
    workflows:
      - TruthOS CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_PROJECT_ID: 2a0c0d84-ad7b-493a-84dd-eebcda0248cf
      RAILWAY_ENVIRONMENT: production
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.57.2

      - name: Verify Railway token
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Missing RAILWAY_TOKEN GitHub Actions secret."
            exit 1
          fi

      - name: Deploy truth-api
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service truth-api \
            --detach \
            --message "GitHub Actions deploy truth-api ${DEPLOY_SHA}"

      - name: Deploy hermes-agent
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service hermes-agent \
            --detach \
            --message "GitHub Actions deploy hermes-agent ${DEPLOY_SHA}"

      - name: Deploy truthos-web
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service truthos-web \
            --detach \
            --message "GitHub Actions deploy truthos-web ${DEPLOY_SHA}"
